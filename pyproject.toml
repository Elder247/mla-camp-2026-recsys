[project]
name = "mla-two-stage"
version = "0.1.0"
description = "Two-stage candidate generation and ranking for ML Camp"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2,<1.4",
  "polars>=1.30,<2",
  "pyarrow>=20,<26",
]

[project.optional-dependencies]
ranker = ["catboost>=1.2.10,<2"]
yandex = ["yql>=1.2.128", "yandex-yt"]
monitoring = ["yandex-underdeep==1.0.58"]
dev = ["pytest>=8,<9"]

[tool.ruff]
line-length = 100
