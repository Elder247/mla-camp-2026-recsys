extends: v15_combined_logq_half_chrono_10m.yaml

experiment:
  name: two_tower_v16_multihash_piecewise_logq_half_chrono_10m

paths:
  artifact_dir: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v16_multihash_piecewise_logq_half_chrono_10m_model

tracking:
  underdeep:
    run_name: two-tower-v16-multihash-piecewise-logq-half-chrono-10m

model:
  # Independent hashes reduce word-hash collisions without changing the
  # tokenizer contract. Weighted two-knot bags retain within-bin numeric value.
  query_cardinalities:
    query_word_hash2_ids: 65536
  banner_cardinalities:
    title_word_hash2_ids: 65536
    text_word_hash2_ids: 65536
    source_cost_piecewise_ids: 32
    product_price_piecewise_ids: 32

numeric_features:
  source_cost_piecewise_log1p_scale: 1.5
  product_price_piecewise_log1p_scale: 1.5
