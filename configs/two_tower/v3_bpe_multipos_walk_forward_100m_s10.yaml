extends: v3_bpe_multipos_chrono_100m.yaml

experiment:
  name: two_tower_v3_bpe_multipos_walk_forward_100m_s10

paths:
  weekly_train_table: //tmp/astrofimuk_mla_two_stage/train_clicks_100m_bpe_v2
  week_stats_file: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v3_bpe_multipos_walk_forward_100m_s10/week_stats.parquet
  oof_requests_file: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v3_bpe_multipos_walk_forward_100m_s10/oof_requests.parquet
  history_events_file: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v3_bpe_multipos_walk_forward_100m_s10/history_events.parquet
  artifact_dir: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v3_bpe_multipos_walk_forward_100m_s10
  full_quality_artifact: /home/astrofimuk/workspace/mla_two_stage/artifacts/two_tower_v3_bpe_multipos_chrono_100m_model

tracking:
  underdeep:
    run_name: two-tower-v3-bpe-multipos-walk-forward-100m-s10

walk_forward:
  requests_per_week: 750
  min_week_clicks: 1000
  drop_first_weeks: 0
  drop_last_weeks: 0
  max_weeks: 0
  # OOF labels/history use every click; only weekly neural gradient updates are
  # sampled. This keeps the predict-before-update CatBoost contract affordable.
  train_sample_fraction: 0.10
  max_examples_per_week: 400000
  final_artifact_path_key: full_quality_artifact
