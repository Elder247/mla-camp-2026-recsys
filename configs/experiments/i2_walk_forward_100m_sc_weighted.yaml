experiment:
  name: i2_walk_forward_100m_sc_weighted
  description: Cached 100M walk-forward candidates with SourceCost-weighted CatBoost

promotion_gate:
  # Keep the 100M retrieval ceiling and promote only a ranker improvement.
  candidate_sourcecost_recall_at_500: 0.7100
  ranker_sourcecost_recall_at_50: 0.6436637
  ranking_candidates: [rrf, catboost, blend]

submission:
  blend:
    method: rank_linear
    catboost_weight: 0.75

pipeline:
  max_parallel_cg: 3
  merge_partition_workers: 8
  feature_partition_workers: 8
  max_wall_seconds: 3600

paths:
  two_tower_v2_walk_forward_artifact: ${paths.immutable_artifacts}/two_tower_v2_walk_forward_100m_s10
  two_tower_v2_walk_forward_oof_requests: ${paths.two_tower_v2_walk_forward_artifact}/oof_requests.parquet
  two_tower_v2_walk_forward_history_events: ${paths.two_tower_v2_walk_forward_artifact}/history_events.parquet

walk_forward_ranker:
  enabled: true
  oof_requests_path_key: two_tower_v2_walk_forward_oof_requests
  history_events_path_key: two_tower_v2_walk_forward_history_events

candidates:
  # Set to the matching temporal/full donor run at launch time.
  reuse_run: null
  rrf_constant: 40.0
  union_max_candidates: 750
  ranker_pool: 750
  generators:
    tfidf_v1:
      enabled: true
      parallel_priority: 100
      feature_name: tfidf
      code_path_key: tfidf_code
      artifact_path_key: tfidf_artifact
      python_path_keys: [tfidf_root]
      quota: 1000
      top_k: 1000
      weight: 0.25
      request_workers: 8
      parallel_batch_size: 8
    two_tower_v2_walk_forward:
      enabled: true
      resource: gpu
      feature_name: two_tower_v2_walk_forward
      code_path_key: two_tower_v2_walk_forward_code
      code_dependency_path_keys:
        - two_tower_v2_code
        - two_tower_v2_model_code
        - two_tower_v2_data_code
        - two_tower_v2_training_code
        - two_tower_v2_walk_forward_model_code
      artifact_path_key: two_tower_v2_walk_forward_artifact
      python_path_keys: [root, step2_root]
      quota: 1000
      top_k: 1000
      weight: 1.25
      batch_size: 256
    history_query_sc_oof_v1:
      enabled: true
      kind: temporal_history
      feature_name: history_query_sc_oof
      quota: 250
      top_k: 250
      weight: 2.0
      min_clicks: 1
      bayes_prior: 0.0
      external_events_path_key: two_tower_v2_walk_forward_history_events
    history_query_region_oof_v1:
      enabled: true
      kind: temporal_history
      feature_name: history_query_region_oof
      quota: 150
      top_k: 150
      weight: 0.5
      min_clicks: 1
      bayes_prior: 0.0
      external_events_path_key: two_tower_v2_walk_forward_history_events
    global_pop_sc_v1:
      enabled: true
      kind: temporal_history
      feature_name: global_pop_sc
      quota: 75
      top_k: 75
      weight: 0.75
      min_clicks: 2
      bayes_prior: 20.0
      external_events_path_key: two_tower_v2_walk_forward_history_events

features:
  version: feature_v2_walk_forward_100m_s10
  # Set to the same donor as candidates.reuse_run at launch time.
  reuse_run: null
  counter_version: click_events_asof_external_100m_v1
  counter_windows_days: [7, 28, 0]
  counter_families: [query, region]
  enabled:
    - retrieval_provenance_v2
    - request_context_v2
    - candidate_static_v2
    - text_match_v2
    - weekly_counters_v1

ranker:
  version: catboost_logsc_sc_weighted_100m_v1
  kind: ranker_logsc
  iterations: 600
  depth: 8
  learning_rate: 0.07
  l2_leaf_reg: 5.0
  log_sc_scale: 1000000.0
  group_weight:
    kind: source_cost
    cap_quantile: 0.99
    power: 1.0
    minimum: 1.0e-6

evaluation:
  complementarity_baseline_sources: [tfidf_v1]
  high_value_quantile: 0.9
  parity_temporal_workers: 3
