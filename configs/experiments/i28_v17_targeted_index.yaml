experiment:
  name: i28_v17_targeted_index
  description: Cached v17 semantic retrieval over the targeted 1.065M canonical catalog

paths:
  root: /home/astrofimuk/workspace/mla_two_stage_accel
  runs: /home/astrofimuk/workspace/mla_two_stage/runs
  cache: /home/astrofimuk/workspace/mla_two_stage/cache
  immutable_artifacts: /home/astrofimuk/workspace/mla_two_stage/artifacts
  two_tower_v17_targeted_artifact: ${paths.immutable_artifacts}/two_tower_v17_global_logq_chrono_100m_model_targeted1065k

candidates:
  rrf_constant: 20.0
  union_max_candidates: 500
  ranker_pool: 500
  generators:
    two_tower_v17_targeted:
      enabled: true
      resource: gpu
      feature_name: two_tower_v17_targeted
      code_path_key: two_tower_v2_code
      code_dependency_path_keys:
        - two_tower_v2_model_code
        - two_tower_v2_data_code
        - two_tower_v2_training_code
      artifact_path_key: two_tower_v17_targeted_artifact
      python_path_keys: [root, step2_root]
      quota: 500
      top_k: 500
      weight: 1.0
      batch_size: 256
