experiment:
  name: i1_fast_value
  description: Compact high-value I0 candidate set with selected I1 features

promotion_gate:
  candidate_sourcecost_recall_at_500: 0.7048745994
  ranker_sourcecost_recall_at_50: 0.6223875615
  ranking_candidates: [rrf, catboost]

pipeline:
  max_parallel_cg: 3
  max_wall_seconds: 10800

candidates:
  union_max_candidates: 1000
  ranker_pool: 500
  generators:
    tfidf_v1:
      enabled: true
      parallel_priority: 100
      feature_name: tfidf
      code_path_key: tfidf_code
      artifact_path_key: tfidf_artifact
      python_path_keys: [tfidf_root]
      quota: 500
      top_k: 500
      weight: 0.25
    two_tower_fps_v1:
      enabled: true
      resource: gpu
      feature_name: two_tower_fps
      code_path_key: two_tower_batch_code
      code_dependency_path_keys: [step2_inference_code, step2_model_code]
      artifact_path_key: step3_artifact
      python_path_keys: [root, step2_root]
      quota: 750
      top_k: 750
      weight: 1.25
      batch_size: 256
    history_legacy_v1:
      enabled: true
      feature_name: history
      code_path_key: history_code
      artifact_path_key: history_artifact
      python_path_keys: [root, step2_root]
      quota: 200
      top_k: 200
      weight: 2.0

features:
  version: feature_v2
  counter_version: click_events_asof_v1
  counter_windows_days: [7, 28, 0]
  counter_families: [region, domain, group, query]
  enabled:
    - retrieval_provenance_v2
    - request_context_v2
    - candidate_static_v2
    - text_match_v2
    - weekly_counters_v1

ranker:
  version: catboost_logsc_fast_value_v1
  kind: ranker_logsc
  iterations: 600
  depth: 8
  learning_rate: 0.07
  l2_leaf_reg: 5.0

evaluation:
  complementarity_baseline_sources: [tfidf_v1, two_tower_fps_v1]
  high_value_quantile: 0.9
