experiment:
  name: i3_dual_tower_cross_fast_quality
  description: Honest old/v3 walk-forward towers with compact retrieval crosses

promotion_gate:
  candidate_sourcecost_recall_at_500: 0.7190
  ranker_sourcecost_recall_at_50: 0.6531
  ranking_candidates: [rrf, catboost, blend]

submission:
  blend:
    method: rank_linear
    catboost_weight: 0.75

pipeline:
  max_parallel_cg: 3
  merge_partition_workers: 8
  feature_partition_workers: 8
  max_wall_seconds: 10800

paths:
  two_tower_v2_walk_forward_artifact: ${paths.immutable_artifacts}/two_tower_v2_walk_forward_100m_s10_chrono_final_v2
  two_tower_v3_walk_forward_artifact: ${paths.immutable_artifacts}/two_tower_v3_bpe_multipos_walk_forward_100m_s10_r1
  dual_tower_oof_requests: ${paths.two_tower_v2_walk_forward_artifact}/oof_requests.parquet
  dual_tower_history_events: ${paths.two_tower_v2_walk_forward_artifact}/history_events.parquet

walk_forward_ranker:
  enabled: true
  oof_requests_path_key: dual_tower_oof_requests
  history_events_path_key: dual_tower_history_events

candidates:
  reuse_run: null
  rrf_constant: 40.0
  union_max_candidates: 1000
  ranker_pool: 750
  generators:
    tfidf_v1:
      enabled: true
      parallel_priority: 100
      feature_name: tfidf
      code_path_key: tfidf_code
      artifact_path_key: tfidf_artifact
      python_path_keys: [tfidf_root]
      quota: 1000
      top_k: 1000
      weight: 0.25
      request_workers: 8
      parallel_batch_size: 8
    two_tower_v2_walk_forward:
      enabled: true
      resource: gpu
      feature_name: two_tower_v2_walk_forward
      code_path_key: two_tower_v2_walk_forward_code
      code_dependency_path_keys:
        - two_tower_v2_code
        - two_tower_v2_model_code
        - two_tower_v2_data_code
        - two_tower_v2_training_code
        - two_tower_v2_walk_forward_model_code
      artifact_path_key: two_tower_v2_walk_forward_artifact
      python_path_keys: [root, step2_root]
      quota: 1000
      top_k: 1000
      weight: 0.9
      batch_size: 256
    two_tower_v3_walk_forward:
      enabled: true
      resource: gpu
      feature_name: two_tower_v3_walk_forward
      code_path_key: two_tower_v2_walk_forward_code
      code_dependency_path_keys:
        - two_tower_v2_code
        - two_tower_v2_model_code
        - two_tower_v2_data_code
        - two_tower_v2_training_code
        - two_tower_v2_walk_forward_model_code
      artifact_path_key: two_tower_v3_walk_forward_artifact
      python_path_keys: [root, step2_root]
      quota: 1000
      top_k: 1000
      weight: 1.1
      batch_size: 256
    history_query_sc_oof_v1:
      enabled: true
      kind: temporal_history
      feature_name: history_query_sc_oof
      quota: 250
      top_k: 250
      weight: 2.0
      min_clicks: 1
      bayes_prior: 0.0
      external_events_path_key: dual_tower_history_events
    history_query_region_oof_v1:
      enabled: true
      kind: temporal_history
      feature_name: history_query_region_oof
      quota: 150
      top_k: 150
      weight: 0.5
      min_clicks: 1
      bayes_prior: 0.0
      external_events_path_key: dual_tower_history_events
    global_pop_sc_v1:
      enabled: true
      kind: temporal_history
      feature_name: global_pop_sc
      quota: 75
      top_k: 75
      weight: 0.75
      min_clicks: 2
      bayes_prior: 20.0
      external_events_path_key: dual_tower_history_events

features:
  version: feature_v3_dual_tower_cross
  counter_version: click_events_asof_external_100m_v1
  counter_windows_days: [7, 28, 0]
  counter_families: [query, region]
  enabled:
    - retrieval_provenance_v2
    - request_context_v2
    - candidate_static_v2
    - text_match_v2
    - weekly_counters_v1
    - retrieval_cross_features_v2

ranker:
  version: catboost_queryrmse_dual_tower_cross_v1
  kind: ranker_logsc
  loss_function: QueryRMSE
  selection_metric: sourcecost_recall
  selection_eval_period: 25
  iterations: 400
  depth: 8
  learning_rate: 0.07
  l2_leaf_reg: 5.0
  log_sc_scale: 1000000.0

evaluation:
  complementarity_baseline_sources: [tfidf_v1, two_tower_v2_walk_forward]
  high_value_quantile: 0.9
  parity_temporal_workers: 3
